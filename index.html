<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="../icon.svg">
    <meta name="description" content="Mars Colony — drive a rover, fly a drone and walk a surface unit across real Mars terrain from Jezero and Gale craters.">
    <title>SIGNAL — Mars Colony</title>

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SIGNAL — Mars Colony">
    <meta property="og:description" content="Drive, fly and walk across real Mars terrain — Jezero and Gale craters, from real elevation data.">
    <meta property="og:url" content="https://signal-playground-0uj.pages.dev/mars-colony/">
    <meta property="og:site_name" content="SIGNAL">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Three.js ESM via import map — latest stable (0.185.1), intentionally newer
         than this project's other games (pinned at 0.160.1); this is a standalone
         game with no shared vendor files, so it can track latest independently. -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Site Hub — 3D Mars globe (plan 22-B/C). Its own canvas + short-lived
         WebGL context (hub.js), disposed before the sim boots so only one
         context is ever live. Hidden until boot() decides to show it. -->
    <div id="hub-root" hidden>
        <canvas id="hub-canvas"></canvas>
        <div id="hub-ui">
            <div id="hub-title">
                <h1>MARS COLONY</h1>
                <p>SELECT A LANDING SITE</p>
            </div>
            <!-- Cloud save (plan 23): sign in to sync progress to YOUR Google
                 Drive. Hidden/inert until GOOGLE_CLIENT_ID is set in cloudsync.js. -->
            <div id="hub-cloud" hidden>
                <button id="hub-signin" class="mars-btn hub-cloud__signin">Sign in with Google</button>
                <div id="hub-cloud-status" class="hub-cloud__status" hidden>
                    <span id="hub-cloud-chip" class="hub-cloud__chip" data-state="synced"></span>
                    <button id="hub-signout" class="hub-cloud__signout">Sign out</button>
                </div>
            </div>
            <!-- Pin card — populated by hub.js on pin pick; RESET SITE and the
                 hub-level RESET GAME button are wired in step 5. -->
            <div id="hub-card" hidden aria-live="polite">
                <button id="hub-card-close" aria-label="Close">&times;</button>
                <div id="hub-card-progress" class="hub-card__progress"></div>
                <h2 id="hub-card-name"></h2>
                <div id="hub-card-mission" class="hub-card__mission"></div>
                <div id="hub-card-coords" class="hub-card__coords"></div>
                <div class="hub-card__actions">
                    <button id="hub-card-enter" class="mars-btn hub-card__enter">ENTER</button>
                    <button id="hub-card-reset" class="mars-btn mars-btn--reset hub-card__reset">RESET SITE</button>
                </div>
                <p id="hub-card-locked" class="hub-card__locked" hidden></p>
            </div>
            <!-- Hub-level RESET GAME (plan 22-C, widest tier): wipes every
                 site + prefs, back to a first-boot hub. Two-step arm/confirm. -->
            <button id="hub-reset-game" class="mars-btn mars-btn--reset hub-reset-game">RESET GAME</button>
        </div>
    </div>

    <div id="game-root" hidden>
        <canvas id="mc-canvas"></canvas>
        <div id="mc-hud"></div>
        <div id="mc-touch-move" class="mars-touch-zone mars-touch-zone--left"></div>
        <div id="mc-touch-look" class="mars-touch-zone mars-touch-zone--right"></div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
